<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://clerk.iscalelabs.com https://*.clerk.accounts.dev; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://clerk.iscalelabs.com https://*.clerk.accounts.dev https://*.supabase.co; img-src 'self' data: https: https://img.clerk.com https://*.pinimg.com; frame-src https://clerk.iscalelabs.com https://*.clerk.accounts.dev; frame-ancestors 'none';">
<title>Niches — Pintwist</title>
<meta name="description" content="Top Pinterest search terms aggregated from the Pintwist user base.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#e60023">
<link rel="canonical" href="https://pintwist.iscalelabs.com/niches.html">
<link rel="icon" type="image/png" sizes="16x16" href="/images/icon-16.png">
<link rel="icon" type="image/png" sizes="48x48" href="/images/icon-48.png">
<link rel="icon" type="image/png" sizes="128x128" href="/images/icon-128.png">
<link rel="apple-touch-icon" sizes="128x128" href="/images/icon-128.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<script async crossorigin="anonymous" data-clerk-publishable-key="pk_live_Y2xlcmsuaXNjYWxlbGFicy5jb20k" src="https://clerk.iscalelabs.com/npm/@clerk/clerk-js@5/dist/clerk.browser.js" type="text/javascript"></script>
<script src="/auth.js?v=2026042002" defer></script>
<script src="/niches.js?v=2026042002" defer></script>
</head>
<body>
<div id="app">
  <div class="loading" data-auth-loading>
    <div class="spinner"></div>
    Loading...
  </div>
</div>

<template id="page-template">
  <div id="topbar-host"></div>
  <div id="stats-bar-host"></div>
  <main class="page">
    <header class="page-header">
      <h1 class="page-title">Niches</h1>
      <p class="page-subtitle">Top Pinterest search terms aggregated across the Pintwist fleet. Click a niche to see its pins.</p>
    </header>

    <div class="filters">
      <div class="filter-search">
        <span aria-hidden="true" style="opacity:.5">&#128269;</span>
        <input id="search-input" type="search" placeholder="Filter niches by name..." />
      </div>
      <div class="filter-group">
        <span class="filter-label">Sort</span>
        <select class="filter-select" id="sort-select">
          <option value="volume">Pin volume</option>
          <option value="reach">Cross-user reach</option>
          <option value="saves">Max saves</option>
          <option value="comments">Max comments</option>
          <option value="repins">Max repins</option>
          <option value="reactions">Max reactions</option>
          <option value="shares">Max shares</option>
          <option value="avg_saves">Avg saves per pin</option>
          <option value="recency">Most recent</option>
        </select>
      </div>
      <div class="filter-group">
        <span class="filter-label">Window</span>
        <div class="filter-chips" id="window-chips">
          <button class="chip" data-window="7">7d</button>
          <button class="chip active" data-window="30">30d</button>
          <button class="chip" data-window="90">90d</button>
        </div>
      </div>
      <div class="filter-group">
        <span class="filter-label">Min volume</span>
        <div class="filter-chips" id="minvol-chips">
          <button class="chip active" data-minvol="1">Any</button>
          <button class="chip" data-minvol="5">5+</button>
          <button class="chip" data-minvol="20">20+</button>
          <button class="chip" data-minvol="100">100+</button>
        </div>
      </div>
      <button class="chip" id="btn-export-csv" type="button" title="Download all niches matching current filters as CSV">⤓ Export CSV</button>
    </div>

    <div id="results">
      <div class="loading"><div class="spinner"></div>Loading niches...</div>
    </div>

    <div class="pagination" id="pagination" style="display:none;">
      <button class="btn-load-more" id="load-more" type="button">Load more</button>
    </div>
  </main>
</template>
</body>
</html>
